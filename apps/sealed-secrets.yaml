apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # infra before workloads (more on this in Phase 4)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets   # a Helm repo, not Git
    chart: sealed-secrets
    targetRevision: 2.18.6
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller   # the name kubeseal expects by default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
