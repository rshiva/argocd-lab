apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rshiva/argocd-lab.git
    targetRevision: main
    path: apps #only application manifests live here
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd  #children are created in argocd ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
